name: CI

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'supabase/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'supabase/**'
      - '.github/workflows/ci.yml'
  # The very first push to a fresh repo does not trigger a push event, so keep a
  # manual entry point for verifying CI from a clean slate.
  workflow_dispatch:

jobs:
  mobile:
    name: Flutter app (analyze · test · debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      # lib/core/tokens.dart is generated output. Fail before the build if someone
      # edited it by hand or changed tokens.json without re-running the generator.
      - name: Brand tokens are in sync
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./tools/make-tokens-dart.ps1 -Check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Same toolchain the app was built with locally.
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  portal:
    name: Web portal (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-portal-dist
          path: apps/web/dist
          if-no-files-found: error
