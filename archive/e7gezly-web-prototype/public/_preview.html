<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>preview harness</title>
    <style>
      body { margin: 0; background: #1b1b1b; font: 12px/1.4 system-ui; color: #eee; }
      h2 { margin: 12px 16px 6px; }
      .wrap { padding: 0 16px 24px; }
      .scaler { transform: scale(0.42); transform-origin: top left; }
      iframe { display: block; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <h2>Desktop 1280 (scaled 42%)</h2>
    <div class="wrap scaler">
      <iframe id="desk" width="1280" height="1600" src="/"></iframe>
    </div>
    <h2>Mobile 390</h2>
    <div class="wrap">
      <iframe id="mob" width="390" height="1400" src="/"></iframe>
    </div>
  </body>
</html>
