openapi: 3.1.0
info:
  title: E7gezly API
  version: 0.1.0
  description: |
    Contract between the Flutter customer app, the Refine portal, and Supabase.

    THIS FILE IS THE SOURCE OF TRUTH. Dart models and TypeScript types are generated
    from it. Hand-editing generated output is a bug.

    Phase 0 scope: identity, geography, category taxonomy. Listings, search, and
    bookings are stubs so both clients can be built against a stable shape.
servers:
  - url: /rest/v1
    description: Supabase PostgREST (auto-generated from the schema)

tags:
  - name: identity
  - name: geography
  - name: categories
  - name: listings
  - name: bookings

paths:
  /profiles:
    get:
      tags: [identity]
      summary: Read the signed-in account's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }

  /governorates:
    get:
      tags: [geography]
      summary: List active governorates
      responses:
        "200":
          description: Governorates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Governorate" }

  /service_categories:
    get:
      tags: [categories]
      summary: Fetch the category tree
      parameters:
        - in: query
          name: parent_id
          required: false
          schema: { type: integer }
          description: Omit for roots, pass a category id for its children
        - in: query
          name: select
          required: false
          schema: { type: string }
          description: PostgREST column projection
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceCategory" }

  /listings:
    get:
      tags: [listings]
      summary: Search the provider directory
      description: |
        Not implemented in Phase 0. The shape is fixed here so the Flutter search
        screen and the portal table can be built in parallel.
      x-status: planned
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Free-text Arabic query. Server normalizes diacritics and alef/ya variants.
        - in: query
          name: category_id
          schema: { type: integer }
        - in: query
          name: governorate_id
          schema: { type: smallint }
        - in: query
          name: max_price
          schema: { type: number }
          description: EGP. Filters on the listing's published starting price.
        - in: query
          name: date
          schema: { type: string, format: date }
          description: Filters against availability_rules. Never filters on a guessed slot.
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }

  /rpc/create_booking_request:
    post:
      tags: [bookings]
      summary: Submit a booking request for review
      description: |
        Creates a request in status `pending`. It does NOT confirm a booking —
        confirmation only happens when a provider accepts. Clients must render the
        result as "request received", never as "booked".
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingRequestDraft" }
      responses:
        "201":
          description: Request created and awaiting provider review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingRequest" }

components:
  schemas:
    AccountRole:
      type: string
      enum: [customer, provider, admin]

    Profile:
      type: object
      required: [id, locale]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: [string, "null"] }
        phone: { type: [string, "null"], description: Stored E.164, displayed as the user typed }
        avatar_url: { type: [string, "null"] }
        locale: { type: string, default: ar-EG }
        phone_verified: { type: boolean, default: false }
        roles:
          type: array
          items: { $ref: "#/components/schemas/AccountRole" }

    Governorate:
      type: object
      required: [id, name_ar]
      properties:
        id: { type: integer, format: int16 }
        name_ar: { type: string }
        name_en: { type: [string, "null"] }
        code: { type: [string, "null"] }

    ServiceCategory:
      type: object
      required: [id, slug, name_ar, depth]
      properties:
        id: { type: integer }
        parent_id: { type: [integer, "null"] }
        slug: { type: string }
        name_ar: { type: string }
        name_en: { type: [string, "null"] }
        description_ar: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        depth: { type: integer, description: Server-derived. Never sent by clients. }
        sort_order: { type: integer, format: int16 }
        active: { type: boolean }

    PriceBand:
      type: string
      enum: [economy, moderate, premium, luxury]

    Listing:
      type: object
      required: [id, provider_id, category_id, title_ar, governorate_id]
      properties:
        id: { type: string, format: uuid }
        provider_id: { type: string, format: uuid }
        category_id: { type: integer }
        title_ar: { type: string }
        summary_ar: { type: [string, "null"] }
        governorate_id: { type: integer, format: int16 }
        area_id: { type: [integer, "null"] }
        address_ar: { type: [string, "null"] }
        price_from_egp: { type: [number, "null"], description: Published starting price in EGP }
        price_band: { $ref: "#/components/schemas/PriceBand" }
        attributes:
          type: object
          description: Values keyed against category_attribute_defs.key
          additionalProperties: true
        status:
          type: string
          enum: [draft, pending_review, published, suspended]
        media:
          type: array
          items: { type: string, description: Storage object path }
        # Ratings and review counts are intentionally absent: they are computed
        # server-side once reviews exist, never sent as a client-supplied field.

    BookingRequestDraft:
      type: object
      required: [listing_id, contact_name, contact_phone]
      properties:
        listing_id: { type: string, format: uuid }
        preferred_date: { type: [string, "null"], format: date }
        preferred_time: { type: [string, "null"] }
        party_size: { type: [integer, "null"], minimum: 1 }
        contact_name: { type: string }
        contact_phone: { type: string }
        notes: { type: [string, "null"], maxLength: 1000 }

    BookingRequest:
      allOf:
        - $ref: "#/components/schemas/BookingRequestDraft"
        - type: object
          required: [id, status, created_at]
          properties:
            id: { type: string, format: uuid }
            requester_id: { type: string, format: uuid }
            status:
              type: string
              enum: [pending, acknowledged, accepted, declined, cancelled, completed]
            created_at: { type: string, format: date-time }
            events:
              type: array
              description: Append-only transition log. The reason a booking is never a boolean.
              items:
                type: object
                properties:
                  from_status: { type: [string, "null"] }
                  to_status: { type: string }
                  actor_id: { type: [string, "null", "format"], format: uuid }
                  at: { type: string, format: date-time }

  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by Supabase Auth. RLS enforces the rest.

security:
  - supabaseJwt: []
